name: Refresh ISO links

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh iso_links.json (aggregate, never drop keys)
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\refresh_iso_links.ps1

      - name: Commit and push if changed
        shell: pwsh
        env:
          GIT_EDITOR: "true"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iso_links.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No ISO link changes."
          } else {
            $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm")
            git commit -m "Update ISO links [$ts]"
            git push origin main
            if ($LASTEXITCODE -ne 0) {
              # Remote moved (e.g. bot pushed meanwhile): rebase and keep our
              # merged file (it is a superset by design: keys are never dropped).
              Write-Host "Push rejected, rebasing onto origin/main..."
              git pull --rebase origin main
              if ($LASTEXITCODE -ne 0) {
                git checkout --ours -- iso_links.json
                git add iso_links.json
                git rebase --continue
              }
              git push origin main
              if ($LASTEXITCODE -ne 0) { throw "Push failed after rebase" }
            }
          }
